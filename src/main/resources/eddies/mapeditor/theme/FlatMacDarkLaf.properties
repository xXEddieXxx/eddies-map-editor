# shortcut: a copy of FlatDarkLaf.properties, as FlatMacDarkLaf does not extend FlatDarkLaf;
# merge them if FlatLaf gets [light]/[dark] key prefixes.
@background = #1E1F22
@foreground = #DFE1E5
@componentBackground = #2B2D30
@buttonBackground = #393B40
@selectionBackground = #344867
@selectionForeground = #DFE1E5
# a list keeps its selection color when the focus is in the panel beside it
@selectionInactiveBackground = #344867
@selectionInactiveForeground = #DFE1E5
Component.borderColor = #4E5157
Separator.foreground = #3D4045
List.selectionArc = 6
List.selectionInsets = 0,4,0,4
# FlatLaf's small is 2 px below the text, 10 px on Windows: too small for secondary lines
small.font = -1
TextField.placeholderForeground = #969BA3
Editor.secondaryText = #B4B8BF
Editor.accentText = #589DF6
Editor.selectionSecondaryText = #C2C6CC
Editor.hover = #333538
Editor.success = #57AB5A
Editor.warning = #D4A72C
Editor.danger = #F47067
Editor.dangerBackground = #473638
# the filled danger button: darker than Editor.danger, so white text on it reads (5.0:1)
Editor.dangerButton = #C93C37
Editor.warningBackground = #3D3826
Editor.toastBackground = #DFE1E5
Editor.toastText = #1F2328
