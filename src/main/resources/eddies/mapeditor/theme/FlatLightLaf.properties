# The editor's light colors on top of FlatLaf's (also for FlatIntelliJLaf, a subclass), loaded by
# Theme.install. FlatMacLightLaf.properties holds the same values: keep the two alike.
# The accent (@accentColor) stays the theme's, so a system accent still wins.
@background = #F3F4F6
@foreground = #1F2328
@componentBackground = #FFFFFF
@buttonBackground = #FFFFFF
@selectionBackground = #E2EBFC
@selectionForeground = #1F2328
# a list keeps its selection color when the focus is in the panel beside it
@selectionInactiveBackground = #E2EBFC
@selectionInactiveForeground = #1F2328
Component.borderColor = #C4C9D0
Separator.foreground = #DADDE2
List.selectionArc = 6
List.selectionInsets = 0,4,0,4
# FlatLaf's small is 2 px below the text, 10 px on Windows: too small for secondary lines
small.font = -1
TextField.placeholderForeground = #8C959F
Editor.secondaryText = #57606A
Editor.accentText = #2F6FEB
Editor.selectionSecondaryText = #57606A
Editor.hover = #F5F5F5
Editor.success = #1A7F37
Editor.warning = #9A6700
Editor.danger = #CF222E
Editor.dangerBackground = #FBEDEE
# the filled danger button: white text on it reads (5.4:1)
Editor.dangerButton = #CF222E
Editor.warningBackground = #FFF8E5
Editor.toastBackground = #1F2328
Editor.toastText = #FFFFFF
