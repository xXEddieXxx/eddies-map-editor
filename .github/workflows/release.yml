name: Release

# Builds the editor and publishes it as a GitHub release. Started by hand:
# Actions > Release > "Run workflow", enter the version (for example 1.2.0). The workflow
#  - refuses a version that already has a tag,
#  - builds against a TripleA release (the newest, or the tag given) and runs the tests,
#  - publishes the release "v<version>" with
#      eddies-map-editor-setup.exe             the Windows setup, a window of its own around the
#                                              msi, for the README's .../releases/latest/download/...
#                                              link; not signed
#      eddies-map-editor-<version>-setup.exe   the same, named by version
#      eddies-map-editor-windows.msi           the msi alone, which the editors of 0.2.3 and 0.2.4
#                                              update with, for the README's
#                                              .../releases/latest/download/... link; not signed
#      eddies-map-editor-<version>-windows.msi the same, named by version
#      eddies-map-editor-windows.zip           the program with its own Java, for the README's
#                                              .../releases/latest/download/... link
#      eddies-map-editor-<version>-windows.zip the same, named by version
#      eddies-map-editor-macos.zip             the program with its own Java for Macs with Apple
#                                              silicon, for the README's link; not signed
#      eddies-map-editor-<version>-macos.zip   the same, named by version
#      eddies-map-editor-<version>.zip         for every system, needs Java 25 installed
#    and in the release notes the version's section of CHANGELOG.md ("## <version>", without which
#    it stops before building), then the downloads and the TripleA release it was built with.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0 (becomes tag v1.2.0)"
        required: true
        type: string
      triplea_release:
        description: "TripleA release tag to build with, empty for the newest"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # the Mac program: built first, so a release never lacks the file the README links to
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # as the release job does, before the Mac build: a release without its notes stops at once
      - name: CHANGELOG.md has the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          V="${VERSION#v}"
          if ! grep -qE "^## ${V//./\\.}( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## $V': write what changed for map makers there first"; exit 1
          fi

      - name: TripleA
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.triplea_release }}
        run: |
          gh release download $TAG -R triplea-game/triplea -p game-headed.zip
          unzip -q game-headed.zip -d triplea

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # ditto, not Gradle's zip: it keeps the app's links and its signature whole
      - name: Package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ./gradlew appImage -PtripleaHome=triplea -PappVersion="${VERSION#v}"
          ditto -c -k --keepParent "build/app-image/Eddies Map Editor.app" eddies-map-editor-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: eddies-map-editor-macos
          path: eddies-map-editor-macos.zip

  release:
    needs: mac
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          V="${VERSION#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3, got '$VERSION'"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null || git ls-remote --exit-code --tags origin "v$V" >/dev/null 2>&1; then
            echo "::error::tag v$V already exists; pick a new version"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: What changed, from CHANGELOG.md
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          # the version's section: from its heading "## <version>" (a date may follow) to the next
          awk -v v="## $V" 'index($0, v) == 1 && (length($0) == length(v) || substr($0, length(v) + 1, 1) == " ") {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::CHANGELOG.md has no section '## $V': write what changed for map makers there first"; exit 1
          fi

      - name: TripleA
        id: triplea
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.triplea_release }}
        run: |
          gh release download $TAG -R triplea-game/triplea -p game-headed.zip
          unzip -q game-headed.zip -d triplea
          echo "release=$(ls triplea/bin | sed 's/^game-headed-//; s/\.jar$//')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # jpackage makes the msi with the WiX toolset 3, and the setup is made with it; the runner
      # brings it, else it is installed. WIX names its folder for the build, as WiX's installer
      # does for a new shell.
      - name: WiX
        run: |
          if ! ls "/c/Program Files (x86)"/WiX\ Toolset\ v3*/bin/candle.exe >/dev/null 2>&1; then
            choco install wixtoolset --version=3.14.1 -y --no-progress
          fi
          echo "WIX=$(cygpath -w "$(ls -d "/c/Program Files (x86)"/WiX\ Toolset\ v3*/ | tail -1)")" >> "$GITHUB_ENV"

      - name: Test and package
        run: ./gradlew test appZip appSetup distZip -PtripleaHome=triplea -PappVersion=${{ steps.version.outputs.version }}

      - uses: actions/download-artifact@v4
        with:
          name: eddies-map-editor-macos
          path: build/distributions

      - name: Name the files
        run: |
          V=${{ steps.version.outputs.version }}
          cd build/distributions
          cp ../setup/eddies-map-editor-setup.exe .
          cp eddies-map-editor-setup.exe "eddies-map-editor-$V-setup.exe"
          cp ../installer/eddies-map-editor-windows.msi .
          cp eddies-map-editor-windows.msi "eddies-map-editor-$V-windows.msi"
          cp eddies-map-editor-macos.zip "eddies-map-editor-$V-macos.zip"
          cp eddies-map-editor-windows.zip "eddies-map-editor-$V-windows.zip"
          mv eddies-map-editor.zip "eddies-map-editor-$V.zip"
          ls -l

      - name: Release notes
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          # what changed for map makers first, then where to download it
          {
            echo "## What's new in $V"
            echo
            cat changes.md
            echo
            echo "---"
            echo
            cat <<'NOTES'
          **Windows:** [**⬇️ Download the setup**](https://github.com/xXEddieXxx/eddies-map-editor/releases/download/v${{ steps.version.outputs.version }}/eddies-map-editor-setup.exe) and open it: it installs the editor for you alone, without administrator rights, and replaces an older installed version. Its window shows the folder it installs into, `%LOCALAPPDATA%\Eddies Map Editor` (that is `C:\Users\<you>\AppData\Local\Eddies Map Editor`) unless you choose another, and offers a Start menu entry and a desktop shortcut: start the editor from **Eddies Map Editor** in the Start menu or on the desktop. It is not signed: on Windows' warning choose More info › Run anyway. An installed editor installs this version by itself: File › Look for a new version. Without installing: download [`eddies-map-editor-windows.zip`](https://github.com/xXEddieXxx/eddies-map-editor/releases/download/v${{ steps.version.outputs.version }}/eddies-map-editor-windows.zip), unzip it and start `Eddies Map Editor.exe`. Both bring their own Java.
          **macOS (Apple silicon):** download [`eddies-map-editor-macos.zip`](https://github.com/xXEddieXxx/eddies-map-editor/releases/download/v${{ steps.version.outputs.version }}/eddies-map-editor-macos.zip), unzip it and open `Eddies Map Editor.app`. It brings its own Java. It is not signed: the first time, right-click it and choose Open, or allow it under System Settings › Privacy & Security.
          **Other systems:** `eddies-map-editor-${{ steps.version.outputs.version }}.zip` needs Java 25; start `bin/eddies-map-editor`.

          **Needs TripleA installed** (triplea-game.org): the editor runs with it and finds it by itself, or asks where it is. Built and tested with TripleA ${{ steps.triplea.outputs.release }}.
          NOTES
          } > release-notes.md

      - name: Publish release v${{ steps.version.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          # the tag on the commit that was built and tested
          target_commitish: ${{ github.sha }}
          name: Eddie's Map Editor ${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          body_path: release-notes.md
          files: |
            build/distributions/eddies-map-editor-setup.exe
            build/distributions/eddies-map-editor-${{ steps.version.outputs.version }}-setup.exe
            build/distributions/eddies-map-editor-windows.msi
            build/distributions/eddies-map-editor-${{ steps.version.outputs.version }}-windows.msi
            build/distributions/eddies-map-editor-windows.zip
            build/distributions/eddies-map-editor-${{ steps.version.outputs.version }}-windows.zip
            build/distributions/eddies-map-editor-macos.zip
            build/distributions/eddies-map-editor-${{ steps.version.outputs.version }}-macos.zip
            build/distributions/eddies-map-editor-${{ steps.version.outputs.version }}.zip
