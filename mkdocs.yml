# The user guide as a site: docs/guide rendered by MkDocs with the Material theme, built and
# published by .github/workflows/docs.yml on each push to main. The Markdown stays the source.
site_name: Eddie's Map Editor
site_description: User guide of Eddie's Map Editor, a map editor for TripleA
site_url: https://xxeddiexxx.github.io/eddies-map-editor/
repo_url: https://github.com/xXEddieXxx/eddies-map-editor
repo_name: eddies-map-editor
edit_uri: edit/main/docs/guide/
docs_dir: docs/guide
site_dir: build/site

theme:
  name: material
  language: en
  logo: img/icon.png
  favicon: img/icon.png
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Dark

extra_css:
  - assets/extra.css

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - Start: README.md
  - Basics:
      - Menus: menus.md
      - New map: new-map.md
      - Home: home.md
  - Map:
      - Territories: territories.md
      - Connections: connections.md
      - Canals: canals.md
      - Terrain effects: terrain-effects.md
      - Map look: map-look.md
  - Players:
      - Nations: nations.md
      - Politics: politics.md
      - Objectives: objectives.md
      - Technology: technology.md
  - Units & economy:
      - Units: units.md
      - Production: production.md
  - Game flow:
      - Turn order: turn-order.md
      - Game options: game-options.md
      - Actions: actions.md
      - Triggers: triggers.md
  - Texts & sound:
      - Game notes: game-notes.md
      - Texts: texts.md
      - Sounds: sounds.md
  - Share & advanced:
      - Publish: publish.md
      - Attachments: attachments.md
      - Files: files.md
